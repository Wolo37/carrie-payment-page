<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay Carrie B's Art Co.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f2ec;
      font-family: Arial, sans-serif;
      color: #252525;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { font-size: 30px; margin: 0 0 12px; }
    .brand-logo { display: block; width: 100%; height: auto; }
    p { color: #666; line-height: 1.5; }
    .button {
      display: block;
      padding: 19px 16px;
      margin: 16px 0;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
    }
    .cashapp { background: #00b84a; }
    .paypal { background: #174d9d; }
    .venmo { background: #008cff; }
    .button:focus-visible, .social-links a:focus-visible {
      outline: 3px solid #222;
      outline-offset: 3px;
    }
    .note { font-size: 13px; margin-top: 24px; }
    .social-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e8e3da;
    }
    .social-footer h2 { margin: 0 0 12px; font-size: 17px; }
    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
    }
    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 10px;
      color: #174d9d;
      font-size: 15px;
      font-weight: bold;
      text-underline-offset: 3px;
    }
    .social-links a:hover { background: #f5f2ec; }
    .social-links svg { width: 30px; height: 30px; fill: currentColor; }
    .social-links .facebook { color: #1877f2; }
    .social-links .tiktok { color: #111; }
  </style>
</head>
<body>
  <main class="card">
    <h1><img class="brand-logo" src="carrie-bs-art-co.png" alt="Carrie B's Art Co."></h1>
    <p>Thank you for shopping with us!</p>
    <p>Choose your preferred payment method.</p>

    <a class="button cashapp"
       href="https://cash.app/$CarrieBartco">
      Pay with Cash App
    </a>

    <a class="button paypal"
       href="https://www.paypal.me/CarrieByram">
      Pay with PayPal
    </a>

    <a class="button venmo"
       href="https://venmo.com/u/Carrie-Byram">
      Pay with Venmo
    </a>

    <p class="note">
      Please verify the recipient before sending payment.
      Payments are completed through your chosen provider.
    </p>

    <footer class="social-footer">
      <h2>Follow Carrie B's Art Co.</h2>
      <nav class="social-links" aria-label="Social media">
        <a href="https://www.facebook.com/p/Carrie-Bs-Art-Co-61565653542229/"
           class="facebook" aria-label="Carrie B's Art Co. on Facebook" title="Facebook"
           target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.972h-1.513c-1.49 0-1.956.931-1.956 1.887v2.262h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
        </a>
        <a href="https://www.tiktok.com/@carriebyram895"
           class="tiktok" aria-label="Carrie B's Art Co. on TikTok, @carriebyram895" title="TikTok @carriebyram895"
           target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.2-.66 2.78-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </a>
      </nav>
    </footer>
  </main>
</body>
</html>
